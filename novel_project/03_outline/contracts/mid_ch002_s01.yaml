pov: 刘得宜
purpose: 刘得宜离开吸血鬼后独自反思，回到小屋后玉之灵全面坦白功法系统，内视展示能量网络，暴风雨中完成道心觉悟
must_happen:
  - 刘得宜离开后脸寒如水，分析周腊的真正意图是绑架他上战车
  - 他判断：向国家或族内求援等于变成白老鼠，与吸血鬼合作虽险但有时间
  - 回到小屋后，玉之灵第一次全部坦率告知功法系统的秘密
  - 内视展示：白色能量网络、生物防弹衣、能量分析转化系统、金丹远景
  - 玉之灵揭示：中期目标是核反应提取能量，远期目标是物质能量完全转变
  - 暴风雨中刘得宜完成道心觉悟：不偏激不负重，凭力量立于天地之间
must_not_reveal:
  - 这套功法并非紫罗峡正宗道法（留作后续反转）
  - 功法的创造者的真实身份和目的
  - 刘得宜未来可能面临的天劫具体内容
scene_type: emotion
