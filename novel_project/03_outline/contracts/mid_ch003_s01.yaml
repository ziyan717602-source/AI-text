scene_id: mid_ch003_s01
chapter_id: mid_ch003
pov: 刘得宜
purpose: 刘得宜与李笑颜摊牌，用玉佩试炼她的忠诚；完成与吸血鬼的商业合作落地，刘得宜主动放弃控股权
must_happen:
  - 李笑颜质问玉佩来源，刘得宜承认是自己雕刻的
  - 刘得宜逼李笑颜选择立场：站在他这边还是族内那边
  - 李笑颜脸色苍白，刘得宜解释：每个秘密都关系太大，必须让她清醒
  - 刘得宜对玉之灵坦白：在此事上不信任任何人，父母姐妹妻子儿女皆例外
  - 与钱当迁（周腊）敲定公司细节：刘得宜只要45%股权，不参与经营
  - 股权分配：母亲28%、李笑颜15%、张敏1%、总经理1%
  - 会议场景：刘得宜一言不发，被公司高管鄙视，但他毫不在意
  - 结尾：刘得宜承诺等事情完成后会帮钱当迁提升力量
must_not_reveal:
  - 刘得宜体内功法系统的具体结构和进化路线
  - 刘得宜三年内炼成金丹的具体计划
  - 紫罗峡的完整传承和历史
scene_type: dialogue
target_words: 2500
tone: 冷静到近乎残酷的理性，刘得宜用温柔的语气说出最锋利的话，有种少年老成的悲凉
allowed_characters:
  - 刘得宜
  - 李笑颜
  - 钱当迁（周腊）
state_delta:
  character: 刘得宜
  before: 与吸血鬼达成初步合作，内心有恐惧但开始清醒
  after: 完成世俗布局（公司、家族利益分配），与李笑颜关系重新定义，战略上获得主动权
