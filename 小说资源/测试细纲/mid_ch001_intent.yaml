chapter_id: mid_ch001
title: 接触

goal:
  - 建立刘得宜与吸血鬼周腊（钱当迁）的第一次正式交锋
  - 展现周腊的图谋：用世俗资源（公司、人脉）绑定刘得宜
  - 刘得宜在不暴露底牌的前提下，谨慎接受合作并设下边界

must_include:
  - 周腊试探刘得宜是否为"永恒者"，刘得宜否认但不完全否认修仙者身份
  - 周腊分析中国暗世界的处境：大一统传统下，超凡者不容于国家
  - 周腊提出商业合作方案：几千万外资公司，刘得宜占六成股权
  - 刘得宜反问"天下没有白吃的晚餐"，要求合作仅限二人之间
  - 刘得宜给出修炼建议：道家元神之法对吸血鬼是毒药，心魔会反噬

must_not_reveal:
  - 紫罗峡的完整功法体系和基因改造细节
  - 刘得宜体内已形成的能量系统具体结构
  - 玉之灵的真实能力上限

state_change:
  character: 刘得宜
  before: 独自修炼的中学生，对暗世界一无所知
  after: 与吸血鬼达成初步合作，获得世俗资源但被绑定在对方战车上

tone: 棋逢对手的试探，表面客气底下暗流涌动，两个不同世界的存在在谈判桌上博弈

pov: 刘得宜
